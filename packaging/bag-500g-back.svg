 Grotesk', sans-serif" font-weight="700" font-size="3.9600000000000004" fill="#1B120A">Nutrition information (approx.)</text><text x="101.12" y="108.66" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-weight="700" font-size="3.3120000000000003" fill="#1B120A">Per 100 g</text><text x="132.8" y="108.66" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-weight="700" font-size="3.3120000000000003" fill="#1B120A">Per serving</text><path d="M14 104.2 H146" stroke="#1B120A" stroke-width=".25"/><path d="M14 110.4 H146" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="15.5" y="114.86" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.6" fill="#1B120A">Energy (kcal)</text><text x="101.12" y="114.86" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><text x="132.8" y="114.86" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><path d="M14 116.6 H146" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="15.5" y="121.06" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.6" fill="#1B120A">Protein (g)</text><text x="101.12" y="121.06" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><text x="132.8" y="121.06" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><path d="M14 122.8 H146" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="15.5" y="127.26" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.6" fill="#1B120A">Carbohydrate (g)</text><text x="101.12" y="127.26" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><text x="132.8" y="127.26" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><path d="M14 129.0 H146" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="15.5" y="133.46" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.6" fill="#1B120A">  of which total sugars (g)</text><text x="101.12" y="133.46" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><text x="132.8" y="133.46" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><path d="M14 135.2 H146" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="15.5" y="139.66" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.6" fill="#1B120A">Total fat (g)</text><text x="101.12" y="139.66" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><text x="132.8" y="139.66" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><path d="M14 141.4 H146" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="15.5" y="145.86" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.6" fill="#1B120A">Dietary fibre (g)</text><text x="101.12" y="145.86" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><text x="132.8" y="145.86" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><path d="M14 147.6 H146" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="15.5" y="152.06" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.6" fill="#1B120A">Sodium (mg)</text><text x="101.12" y="152.06" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><text x="132.8" y="152.06" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="3.6" fill="#8B7B63">__</text><text x="14" y="160.40" text-anchor="start" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3" fill="#6B5B45">Values to be filled after NABL lab testing.</text><text x="14" y="170.00" text-anchor="start" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.5" fill="#1B120A"><tspan font-weight="700">Ingredients:</tspan> Wheat protein, soy protein [declare in descending order of quantity,</text><text x="14" y="174.50" text-anchor="start" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.5" fill="#1B120A">with percentages].</text><text x="14" y="181.40" text-anchor="start" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.5" fill="#1B120A"><tspan font-weight="700">Allergen advice:</tspan> Contains wheat (gluten) and soy.</text><text x="14" y="188.00" text-anchor="start" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.5" fill="#1B120A"><tspan font-weight="700">Storage:</tspan> Store in a cool, dry place. Close the zip after each use.</text><text x="14" y="194.60" text-anchor="start" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.5" fill="#1B120A"><tspan font-weight="700">Best before:</tspan> [__] months from date of packing.</text><text x="14" y="201.20" text-anchor="start" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.2" fill="#1B120A">Mfd. &amp; marketed by: [Name and full address of manufacturer / marketer]</text><text x="14" y="207.00" text-anchor="start" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="3.2" fill="#1B120A">FSSAI Lic. No. [14 digits]  &#183;  Customer care: [phone / email]  &#183;  prograin.in</text><g transform="translate(14 213.4)"><rect width="6.4" height="6.4" fill="#fff" stroke="#0A7A32" stroke-width="0.576"/><circle cx="3.2" cy="3.2" r="1.7280000000000002" fill="#0A7A32"/></g><text x="23" y="218.20" text-anchor="start" font-family="'Hanken Grotesk', sans-serif" font-weight="700" font-size="4.2" fill="#1B120A">MRP &#8377