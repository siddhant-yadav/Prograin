A">Per 100 g</text><text x="74.60000000000001" y="54.05" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-weight="700" font-size="2.3000000000000003" fill="#1B120A">Per 30 g</text><path d="M8 51.1 H82" stroke="#1B120A" stroke-width=".25"/><path d="M8 55.2 H82" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="9.5" y="58.15" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="2.5" fill="#1B120A">Energy (kcal)</text><text x="56.84" y="58.15" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><text x="74.60000000000001" y="58.15" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><path d="M8 59.3 H82" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="9.5" y="62.25" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="2.5" fill="#1B120A">Protein (g)</text><text x="56.84" y="62.25" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><text x="74.60000000000001" y="62.25" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><path d="M8 63.4 H82" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="9.5" y="66.35" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="2.5" fill="#1B120A">Carbohydrate (g)</text><text x="56.84" y="66.35" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><text x="74.60000000000001" y="66.35" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><path d="M8 67.5 H82" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="9.5" y="70.45" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="2.5" fill="#1B120A">  of which sugars (g)</text><text x="56.84" y="70.45" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><text x="74.60000000000001" y="70.45" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><path d="M8 71.6 H82" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="9.5" y="74.55" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="2.5" fill="#1B120A">Fat (g)</text><text x="56.84" y="74.55" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><text x="74.60000000000001" y="74.55" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><path d="M8 75.69999999999999 H82" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="9.5" y="78.65" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="2.5" fill="#1B120A">Dietary fibre (g)</text><text x="56.84" y="78.65" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><text x="74.60000000000001" y="78.65" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><path d="M8 79.8 H82" stroke="#1B120A" stroke-opacity=".35" stroke-width=".2"/><text x="9.5" y="82.75" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="2.5" fill="#1B120A">Sodium (mg)</text><text x="56.84" y="82.75" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><text x="74.60000000000001" y="82.75" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-size="2.5" fill="#8B7B63">__</text><text x="8" y="92.40" text-anchor="start" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="2.1" fill="#6B5B45">Values to be filled after NABL lab testing.</text><text x="8" y="97.60" text-anchor="start" font-family="'Hanken Grotesk', sans-serif" font-weight="500" font-size="2.5" fill="#1B12